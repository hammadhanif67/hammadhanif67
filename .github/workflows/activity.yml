name: Activity card

on:
  schedule:
    - cron: "15 0 * * *" # daily, 00:15 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/activity.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build activity.svg
        run: |
          pip install --quiet fonttools==4.55.3
          mkdir -p dist
          python tools/build_activity.py "${{ github.repository_owner }}" dist/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
