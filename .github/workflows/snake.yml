name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Monochrome grid with a red snake (matches the profile palette)
          outputs: |
            dist/grid-light.svg?color_snake=#E30613&color_dots=#f0f0f0,#c9c9c9,#8f8f8f,#4d4d4d,#111111
            dist/grid-dark.svg?color_snake=#E30613&color_dots=#1a1a1a,#3a3a3a,#6b6b6b,#a8a8a8,#f5f5f5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
